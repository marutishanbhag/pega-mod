name: Build & Push Fine-Tuning Docker Image

on:
  push:
    branches:
      - feature/ms
      - main
    paths:
      - "ms-phi3-finetune/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'YOUR_DOCKERHUB_USERNAME' }}
  IMAGE_NAME: pega-phi3-finetune
  CONTEXT: ms-phi3-finetune

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build-push.outputs.digest }}"

      - name: Verify RunPod API token is set
        run: |
          if [ -z "${{ secrets.RUNPOD_API_KEY }}" ]; then
            echo "WARNING: RUNPOD_API_KEY secret is not set."
            echo "Add it in: repo Settings → Secrets and variables → Actions → New repository secret"
          else
            echo "RunPod API key is configured."
          fi
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
